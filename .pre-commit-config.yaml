# Hooks run from repo root; backend tests live in backend/, so each hook
# cd's in first. pytest is resolved from $VIRTUAL_ENV if a venv is active,
# else from backend/.venv — so GUI git clients (VSCode, etc.) that don't
# inherit the terminal's activated venv still work.
repos:
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit)
        entry: bash -c 'cd backend && "${VIRTUAL_ENV:-$PWD/.venv}/bin/pytest" tests/unit -q'
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-integration
        name: pytest (integration)
        entry: bash -c 'cd backend && "${VIRTUAL_ENV:-$PWD/.venv}/bin/pytest" tests/integration -q'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: eslint-frontend
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        always_run: true

      # Formatters write fixes to disk (unstaged).
      - id: prettier-frontend
        name: prettier (frontend)
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^frontend/.*\.(m?[jt]sx?|json|jsonc|css|scss|html|md|ya?ml)$

      # Refreezes backend/requirements.txt from `uv pip freeze` whenever the
      # uv config changes. --locked stops the commit if uv.lock is itself out
      # of sync with pyproject.toml. Rewritten file is left unstaged so the
      # dev reviews it before re-adding.
      - id: freeze-requirements
        name: freeze requirements.txt (uv)
        entry: >-
          bash -c '
          cd backend &&
          uv sync --locked -q &&
          uv pip freeze > requirements.txt.new &&
          if ! diff -q requirements.txt requirements.txt.new > /dev/null; then
            mv requirements.txt.new requirements.txt;
            echo "backend/requirements.txt was stale and has been regenerated from uv. Review and git add it, then commit again.";
            exit 1;
          fi;
          rm -f requirements.txt.new
          '
        language: system
        pass_filenames: false
        files: ^backend/(pyproject\.toml|uv\.lock)$

  # Lint + format backend. ruff auto-discovers backend/pyproject.toml per file.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        files: ^backend/.*\.py$
