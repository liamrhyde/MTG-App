[project]
authors = [
    { name = "Liam Hyde", email = "liamrhyde@gmail.com" },
    { name = "Paskal W", email = "paskal.wolski@gmail.com" },
]
name = "backend"
version = "3.13.15"
description = "API for tracking Magic the Gathering deck Elo, damage, eliminations and game history."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlmodel>=0.0.39",
]

[tool.ruff.lint]
extend-select = [
    "I",      # isort: import sorting
    "RUF022", # __all__ sorting
    "RUF023", # __slots__ sorting
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
backend = "src.backend.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pylint>=4.0.7",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
